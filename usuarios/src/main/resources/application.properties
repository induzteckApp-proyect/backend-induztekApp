spring.application.name=USUARIOS
server.port=8081

# MySQL - Laragon local: root / contraseña vacia
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induztek_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induztek_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# Tokens de activacion
app.tokens.expiration-minutes=${TOKEN_EXPIRATION_MINUTES:30}
app.tokens.expose-in-development=${EXPOSE_DEV_TOKENS:false}

# Gmail SMTP
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info

# Archivos
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=${UPLOAD_DIR:uploads/avatars}

# Comunicacion interna
app.internal.token=${INTERNAL_SERVICE_TOKEN}

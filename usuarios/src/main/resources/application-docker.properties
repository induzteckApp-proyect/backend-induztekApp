spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/induztek_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:induztek}
spring.datasource.password=${DB_PASSWORD:induztek_dev_password}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=usuarios
eureka.instance.instance-id=USUARIOS:${server.port}

spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB
app.upload-dir=${UPLOAD_DIR:/app/uploads/avatars}


# Base de datos Docker
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/induztek_activos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Eureka dentro de la red Docker
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=false
eureka.instance.hostname=activos
eureka.instance.instance-id=ACTIVOS:${server.port}

# Comunicacion entre contenedores
app.usuarios.url=${USUARIOS_URL:http://usuarios:8081}

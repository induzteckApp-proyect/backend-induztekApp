spring.application.name=ACTIVOS
server.port=${SERVER_PORT:8082}

# MySQL - Laragon local: root / contraseña vacia
#spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induztek_activos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/induztek_activos?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Seguridad compartida
app.jwt.secret=${JWT_SECRET}
app.internal.token=${INTERNAL_SERVICE_TOKEN}

# Comunicacion con Usuarios
app.usuarios.url=${USUARIOS_URL:http://localhost:8081}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info


server:
  port: 8090

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:

          # Configuración global CORS
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:8081"
                  - "http://localhost:8082"
                  - "http://localhost:8083"
                  - "http://127.0.0.1:8081"
                  - "http://127.0.0.1:8082"
                  - "http://127.0.0.1:8083"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                maxAge: 3600

          # Rutas de los microservicios
          routes:
            - id: activos
              uri: lb://ACTIVOS
              predicates:
                - Path=/api/activos/**

            - id: protocolos
              uri: lb://PROTOCOLOS
              predicates:
                - Path=/api/protocolos/**

            - id: usuarios
              uri: lb://USUARIOS
              predicates:
                - Path=/api/**

            - id: usuarios-media
              uri: lb://USUARIOS
              predicates:
                - Path=/media/avatars/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

management:

  endpoint:
      gateway:
        access: read-only

  endpoints:
    web:
      exposure:
        include: health,info,gateway

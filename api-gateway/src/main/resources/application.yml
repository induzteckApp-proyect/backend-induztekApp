server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: activos
              uri: lb://ACTIVOS
              predicates:
                - Path=/api/activos/**
            - id: protocolos
              uri: lb://PROTOCOLOS
              predicates:
                - Path=/api/protocolos/**
            - id: usuarios
              uri: lb://USUARIOS
              predicates:
                - Path=/api/**
            - id: usuarios-media
              uri: lb://USUARIOS
              predicates:
                - Path=/media/avatars/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
